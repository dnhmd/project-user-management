# Application Settings
app:
  name: user-management
  debug: true
  environment: development
  admin-email: ${ADMIN_EMAIL:admin@app.com}
  admin-password: ${ADMIN_PASSWORD:Admin@Password123}

# Database Settings
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/user-management
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

# Security Settings
security:
  secret-key: ${SECRET_KEY:change-me-in-production-must-be-32chars}
  access-token-expire-minutes: 30
  algorithm: "HS256"
  password-reset-token-expire-minutes: 10
  refresh-token-expire-days: 7